    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      body {
        background-color: #f8fafc;
        color: #1e293b;
        height: 100vh;
        max-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow: hidden;
      }

      .page-container {
        width: 100%;
        max-width: 1180px;
        height: 100%;
        max-height: 680px;
        background: #ffffff;
        border-radius: 24px;
        display: flex;
        box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        padding: 16px;
        gap: 20px;
      }

      .form-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 10px 24px;
        height: 100%;
      }

      .form-wrapper {
        width: 100%;
        max-width: 380px;
      }

      .header-content {
        text-align: center;
        margin-bottom: 20px;
      }

      .header-content h1 {
        font-size: 26px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 6px;
        letter-spacing: -0.5px;
      }

      .header-content p {
        color: #64748b;
        font-size: 13.5px;
        font-weight: 400;
        line-height: 1.3;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .form-group label {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 6px;
      }

      .input-control {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 14px;
        color: #0f172a;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .input-control::placeholder {
        color: #94a3b8;
      }

      .input-control:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        font-size: 13px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #64748b;
        cursor: pointer;
        user-select: none;
      }

      .remember-me input[type="checkbox"] {
        width: 15px;
        height: 15px;
        border-radius: 4px;
        border: 1px solid #cbd5e1;
        accent-color: #2563eb;
        cursor: pointer;
      }

      .forgot-link {
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .forgot-link:hover {
        color: #1d4ed8;
        text-decoration: underline;
      }

      .btn-submit {
        width: 100%;
        height: 46px;
        background-color: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          transform 0.1s ease;
      }

      .btn-submit:hover {
        background-color: #1d4ed8;
      }

      .btn-submit:active {
        transform: scale(0.99);
      }

      .btn-submit:disabled {
        background-color: #93c5fd;
        cursor: not-allowed;
      }

      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 18px 0;
        color: #94a3b8;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #e2e8f0;
      }

      .divider span {
        padding: 0 10px;
        font-size: 12px;
        color: #64748b;
        font-weight: 500;
      }

      .social-login {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }

      .social-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 42px;
        background-color: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        color: #0f172a;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease;
      }

      .social-btn:hover {
        background-color: #f8fafc;
        border-color: #94a3b8;
      }

      .social-btn svg {
        width: 18px;
        height: 18px;
      }

      .footer-text {
        text-align: center;
        font-size: 13px;
        color: #0f172a;
        font-weight: 600;
      }

      .footer-text a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
        margin-left: 4px;
      }

      .footer-text a:hover {
        text-decoration: underline;
      }

      /* Right Side */
      .hero-section {
        flex: 1.1;
        background: linear-gradient(
          180deg,
          #2b66f6 0%,
          #4f8bf9 50%,
          #91c4ff 100%
        );
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 36px 32px 0 32px;
        position: relative;
        overflow: hidden;
        text-align: center;
        height: 100%;
      }

      .hero-content {
        max-width: 440px;
        z-index: 2;
      }

      .hero-title {
        color: #ffffff;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.25;
        margin-bottom: 10px;
        letter-spacing: -0.5px;
      }

      .hero-subtitle {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        font-weight: 400;
        line-height: 1.4;
      }

      .hero-image-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        margin-top: 10px;
        z-index: 1;
        overflow: hidden;
      }

      .hero-image {
        max-width: 100%;
        max-height: 380px;
        object-fit: contain;
        object-position: bottom;
        display: block;
      }

      @media (max-width: 900px) {
        body {
          overflow: auto;
          height: auto;
        }

        .page-container {
          flex-direction: column;
          max-height: none;
          height: auto;
          padding: 16px;
        }

        .hero-section {
          padding: 30px 20px 0 20px;
          min-height: 380px;
        }

        .hero-title {
          font-size: 24px;
        }
      }

      @media (max-width: 480px) {
        .form-section {
          padding: 10px 0;
        }

        .social-login {
          grid-template-columns: 1fr;
        }

        .header-content h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>

                class="input-control"
                placeholder="Enter your username"
                autocomplete="username"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>

              <input
                type="password"
                id="password"
                class="input-control"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" id="rememberMe" name="remember" />
                <span>Remember me</span>
